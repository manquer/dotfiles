# Shared by every workbox-class host. Personal values (your IP) go in the
# untracked group_vars/all/local.yml — copy local.yml.example.

admin_user: mani
admin_shell: /usr/bin/zsh
# bootstrap.yml installs this as the admin user's only key. It is the key
# Hetzner's Robot put on root at provisioning time.
admin_authorized_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
host_timezone: UTC

# ---------------------------------------------------------------------------
# devsec.hardening.os_hardening — overrides that keep parity with workbox,
# which was hardened by an older release of the role.
# ---------------------------------------------------------------------------
# 2 blocks non-root strace/gdb, which CI jobs and debugging both need.
sysctl_overwrite:
  kernel.yama.ptrace_scope: 1
  # The role writes AND APPLIES ip_forward=0. On a running Docker host that
  # cuts every container's egress at once (workbox, 2026-09-14: all runner
  # pools hung at registration). Every workbox-class host runs Docker.
  net.ipv4.ip_forward: 1
os_auth_pw_max_age: 90
# The role's own template writes `dispatcher = /sbin/audispd` and `disp_qos`,
# both removed from modern audit (warnings on every ausearch), and its default
# `keep_logs` never deletes anything. Ours rotates 10 x 50 MB.
os_auditd_template: "{{ playbook_dir }}/../roles/auditd/templates/auditd.conf.j2"
os_auditd_max_log_file: 50
os_auditd_num_logs: 10
os_auditd_max_log_file_action: rotate

# ---------------------------------------------------------------------------
# sshd
# ---------------------------------------------------------------------------
# Env var NAMES accepted from SendEnv (values never leave the client config).
sshd_accept_env: []

# ---------------------------------------------------------------------------
# Firewall (nftables, table `inet host`): SSH and mosh in, everything else
# dropped, and Docker-published ports unreachable from the WAN. On for every
# host since 2026-10-09, after workbox turned out to publish an orphaned
# devcontainer stack (Postgres, ClickHouse, Hasura) to the internet.
# ---------------------------------------------------------------------------
firewall_enabled: true
firewall_wan_iface: "{{ ansible_default_ipv4.interface }}"
# Drop new inbound connections from the internet to Docker-published ports.
firewall_block_published_ports: true

# ---------------------------------------------------------------------------
# fail2ban
# ---------------------------------------------------------------------------
fail2ban_maxretry: 5
fail2ban_findtime: 10m
fail2ban_bantime: 1h
fail2ban_bantime_maxtime: 1w

# ---------------------------------------------------------------------------
# Runner deploy refs. workbox moves its git checkout to these; workbox2 then
# mirrors workbox's tree in the same run. Bump to roll a merged ops change.
# ---------------------------------------------------------------------------
# 2026-10-06: what workbox runs. Includes 4439a60 (each runner pinned to its
# own set of at most 8 CPUs, block (N-1) mod 12) and 68bdcb2 (load-guard,
# installed on workbox only), on top of #6067 (paginated runner list).
crusible_deploy_ref: c6a4c63bc9e7aadd5a16cac538e054cb0515bab5

# ---------------------------------------------------------------------------
# Diagnostics, on every host. sysstat also gets its collector enabled, so
# `sar` can look back at CPU/IO/memory history after an incident instead of
# only at the present.
extra_packages:
  - btop
  - htop
  - iotop-c
  - sysstat
  - lsof
  - strace
  - tcpdump
  - bind # dig, host
  - mtr
  - iperf3
  - ncdu
  - smartmontools
  - nvme-cli
  - ethtool
  - perf
  - gdb
  - lm_sensors
  - psmisc # pstree, killall, fuser
  - tmux

# btop layout, same on every host (owner, 2026-10-11): the disks/io panel
# beside memory, processes by CPU, a 2 s refresh. Theme stays per host. btop
# writes its whole config back on quit (save_config_on_exit), so a change
# made in its menu lasts until the next playbook run.
btop_settings:
  show_disks: "true"
  proc_sorting: '"cpu lazy"'
  update_ms: "2000"
