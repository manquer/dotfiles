[defaults]
inventory = inventory.yml
roles_path = roles
# requirements.yml installs here; the directory is gitignored.
collections_path = collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
# Arch's /etc/profile.d/80-systemd-osc-context.sh wraps module output in OSC
# escapes, which Ansible reports as "junk after the JSON data". Harmless.
deprecation_warnings = False
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
