- name: Base packages
  community.general.pacman:
    name: [zsh, git, rsync, jq, python-systemd, mosh]
    state: present

- name: Timezone (pool schedules and logs are read in UTC)
  community.general.timezone:
    name: "{{ host_timezone }}"

- name: Hostname
  ansible.builtin.hostname:
    name: "{{ host_hostname }}"
    use: systemd
  when: host_hostname is defined

- name: Admin user login shell
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: "{{ admin_shell }}"

# An absent ~/.zshrc drops zsh into its interactive new-user wizard on login.
- name: Admin user has a .zshrc
  ansible.builtin.copy:
    dest: "/home/{{ admin_user }}/.zshrc"
    content: ""
    force: false
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"

# iotop-c (maintained C rewrite, same `iotop` command) conflicts with the old
# python iotop, and pacman refuses the swap non-interactively.
- name: Replace python iotop with iotop-c
  community.general.pacman:
    name: iotop
    state: absent
  when: "'iotop-c' in (extra_packages | default([]))"

- name: Extra packages (diagnostics, group_vars/all)
  community.general.pacman:
    name: "{{ extra_packages }}"
    state: present
  when: extra_packages | default([]) | length > 0

- name: sysstat collector (sar history)
  ansible.builtin.systemd_service:
    name: sysstat.service
    enabled: true
    state: started
  when: "'sysstat' in (extra_packages | default([]))"

# THP defrag=madvise made every huge-page fault from a madvising runtime (Go,
# V8, jemalloc) compact memory synchronously. On workbox, 2026-10-19, that was
# ~500 compaction stalls/s, ~30M pages scanned/s, 59% system CPU and load ~300
# with 60 GB free. So no fault compacts synchronously (`defer`, now `never`).
# Sysfs knobs, not sysctls, so tmpfiles writes them at boot.
#
# THP enabled=always made every allocation try for a 2M page. On workbox,
# 2026-10-24, no order-9 block was free with 100 GB free, ~640 THP fallbacks/s,
# and each fallback's watermark boost had kswapd reclaim ~110k pages/s into
# zswap: idle devcontainers refilled 25 GB of swap minutes after a drain.
# madvise keeps huge pages for the runtimes that ask for them. defer still
# woke kswapd on every fallback of theirs (~60/s, ~2 GB/min into swap with
# 100 GB free); never takes a free 2M block or falls back, waking nothing.
# kcompactd's proactive compaction and khugepaged still build huge pages.
- name: THP limited to madvise, no reclaim or compaction at fault
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/thp-defrag.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
      w /sys/kernel/mm/transparent_hugepage/defrag - - - - never
  notify: Apply tmpfiles

# The other half of the reclaim above: no boosted kswapd reclaim on a
# fragmentation event. kcompactd still compacts; nothing is evicted for it.
- name: No watermark boost on fragmentation
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-vm-reclaim.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      vm.watermark_boost_factor = 0
  notify: Apply vm sysctl

- name: btop config directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.config/btop"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0750"

# Key by key, not a template: btop owns the rest of the file and rewrites it.
- name: btop layout
  ansible.builtin.lineinfile:
    path: "/home/{{ admin_user }}/.config/btop/btop.conf"
    regexp: "^{{ item.key }} ="
    line: "{{ item.key }} = {{ item.value }}"
    create: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0640"
  loop: "{{ btop_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# One swapfile per host, sized by swapfile_size (group_vars). Created once and
# never resized here: to grow it, swapoff and remove /swapfile, then re-run.
- name: Swapfile
  when: swapfile_size is defined
  block:
    - name: Swapfile allocated
      ansible.builtin.command: fallocate -l {{ swapfile_size }} /swapfile
      args:
        creates: /swapfile
      register: base_swapfile_new

    - name: Swapfile mode
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      # --check does not create the file, so there is nothing to inspect yet
      when: not (ansible_check_mode and base_swapfile_new is changed)

    - name: Swapfile formatted
      ansible.builtin.command: mkswap /swapfile
      when: base_swapfile_new is changed

    - name: Swapfile in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s'
        line: /swapfile none swap defaults,pri=10 0 0

    - name: Active swaps
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: base_swaps
      changed_when: false
      check_mode: false

    - name: Swapfile enabled
      ansible.builtin.command: swapon -p 10 /swapfile
      when: "'/swapfile' not in base_swaps.stdout_lines"
