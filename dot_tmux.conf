unbind C-b
set -g prefix `
bind-key ` send-prefix
set-option -g history-limit 400000
set-option -g renumber-windows on
set -g default-terminal "xterm-256color"
set-option -g default-shell /opt/homebrew/bin/zsh

# Reload this configuration in the running tmux session.
bind-key r source-file ~/.tmux.conf \; display-message "Tmux configuration reloaded"

# Vi key bindings in copy mode
set-window-option -g mode-keys vi

# Disable clock mode in copy mode
set -g clock-mode-style 24

# Status bar: neon matrix green on ghostty background (#000000, Black Metal (Burzum))
set -g status-style "bg=#000000,fg=#00ff41"
set -g status-left-style "fg=#00ff41,bold"
set -g status-right-style "fg=#00ff41"
set -g window-status-current-style "fg=#000000,bg=#00ff41,bold"
set -g window-status-style "fg=#00ff41,bg=#000000"
set -g pane-active-border-style "fg=#00ff41"
set -g pane-border-style "fg=colour22"
set -g message-style "fg=#00ff41,bg=#000000"
set -g clock-mode-colour "#00ff41"
