- name: nftables package
  community.general.pacman:
    name: nftables
    state: present

- name: Host firewall ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/bin/nft -c -f %s
  register: firewall_conf

# Applying a firewall over the connection that applies it: arm an automatic
# rollback first, apply, prove a NEW connection still gets in, then disarm.
# If the proof fails the play stops and the rollback fires in 3 minutes.
- name: Apply the ruleset behind a dead-man switch
  when: firewall_conf.changed and not ansible_check_mode
  block:
    - name: Clear any leftover rollback timer
      ansible.builtin.command: systemctl stop nft-rollback.timer
      failed_when: false
      changed_when: false

    - name: Arm the rollback (destroys only `inet host`)
      ansible.builtin.command: >-
        systemd-run --on-active=180 --unit=nft-rollback
        /usr/bin/nft destroy table inet host
      changed_when: true

    - name: Apply
      ansible.builtin.command: /usr/bin/nft -f /etc/nftables.conf
      changed_when: true

    - name: A fresh SSH connection still gets in
      ansible.builtin.command: >-
        ssh -o BatchMode=yes -o ControlPath=none -o ConnectTimeout=10
        {{ inventory_hostname }} true
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Disarm the rollback
      ansible.builtin.command: systemctl stop nft-rollback.timer
      changed_when: true

- name: nftables loads the ruleset at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
