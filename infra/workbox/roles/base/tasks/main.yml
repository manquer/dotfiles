- name: Base packages
  community.general.pacman:
    name: [zsh, git, rsync, jq, python-systemd, mosh]
    state: present

- name: Timezone (pool schedules and logs are read in UTC)
  community.general.timezone:
    name: "{{ host_timezone }}"

- name: Hostname
  ansible.builtin.hostname:
    name: "{{ host_hostname }}"
    use: systemd
  when: host_hostname is defined

- name: Admin user login shell
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: "{{ admin_shell }}"

# An absent ~/.zshrc drops zsh into its interactive new-user wizard on login.
- name: Admin user has a .zshrc
  ansible.builtin.copy:
    dest: "/home/{{ admin_user }}/.zshrc"
    content: ""
    force: false
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"

# iotop-c (maintained C rewrite, same `iotop` command) conflicts with the old
# python iotop, and pacman refuses the swap non-interactively.
- name: Replace python iotop with iotop-c
  community.general.pacman:
    name: iotop
    state: absent
  when: "'iotop-c' in (extra_packages | default([]))"

- name: Extra packages (diagnostics, group_vars/all)
  community.general.pacman:
    name: "{{ extra_packages }}"
    state: present
  when: extra_packages | default([]) | length > 0

- name: sysstat collector (sar history)
  ansible.builtin.systemd_service:
    name: sysstat.service
    enabled: true
    state: started
  when: "'sysstat' in (extra_packages | default([]))"

# THP defrag=madvise made every huge-page fault from a madvising runtime (Go,
# V8, jemalloc) compact memory synchronously. On workbox, 2026-10-19, that was
# ~500 compaction stalls/s, ~30M pages scanned/s, 59% system CPU and load ~300
# with 60 GB free. `defer` falls back to small pages and leaves compaction to
# kcompactd. A sysfs knob, not a sysctl, so tmpfiles writes it at boot.
- name: THP defrag deferred to kcompactd
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/thp-defrag.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer
  notify: Apply tmpfiles

- name: btop config directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.config/btop"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0750"

# Key by key, not a template: btop owns the rest of the file and rewrites it.
- name: btop layout
  ansible.builtin.lineinfile:
    path: "/home/{{ admin_user }}/.config/btop/btop.conf"
    regexp: "^{{ item.key }} ="
    line: "{{ item.key }} = {{ item.value }}"
    create: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0640"
  loop: "{{ btop_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# One swapfile per host, sized by swapfile_size (group_vars). Created once and
# never resized here: to grow it, swapoff and remove /swapfile, then re-run.
- name: Swapfile
  when: swapfile_size is defined
  block:
    - name: Swapfile allocated
      ansible.builtin.command: fallocate -l {{ swapfile_size }} /swapfile
      args:
        creates: /swapfile
      register: base_swapfile_new

    - name: Swapfile mode
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Swapfile formatted
      ansible.builtin.command: mkswap /swapfile
      when: base_swapfile_new is changed

    - name: Swapfile in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s'
        line: /swapfile none swap defaults,pri=10 0 0

    - name: Active swaps
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: base_swaps
      changed_when: false
      check_mode: false

    - name: Swapfile enabled
      ansible.builtin.command: swapon /swapfile
      when: "'/swapfile' not in base_swaps.stdout_lines"
